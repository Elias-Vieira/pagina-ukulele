<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <link rel="icon" type="image/png" href="/favicon.png" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <link rel="manifest" href="/manifest.json" />

  <title>Curso de Ritmos de Ukulele - Domine as Batidas Mais Usadas</title>

  <!-- Armazenamento de parâmetros UTM para o checkout -->
  <script>
    (function () {
      function getParam(name) {
        return new URLSearchParams(window.location.search).get(name);
      }

      [
        "utm_source",
        "utm_medium",
        "utm_campaign",
        "utm_content",
        "utm_term",
        "sck",
        "ttclid",
        "fbclid",
        "gclid"
      ].forEach(function (key) {
        var value = getParam(key);
        if (value) {
          localStorage.setItem(key, value);
        }
      });
    })();
  </script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      overflow-x: hidden;
    }

    body {
      font-family: Arial, sans-serif;
    }

    #promo-bar {
      width: 100%;
      background: #ff5a00;
      color: white;
      text-align: center;
      font-weight: 700;
      font-size: 15px;
      padding: 12px 10px;
      line-height: 1.4;
      position: relative;
      z-index: 9999;
    }

    #countdown {
      font-weight: 800;
    }

    #root {
      margin: 0;
      padding: 0;
    }
  </style>
  <script type="module" crossorigin src="/assets/index-BFf7Bhb2.js"></script>
  <link rel="stylesheet" crossorigin href="/assets/index-L-WWUEqH.css">
</head>

<body>
  <div id="root"></div>


  <script>
    (function () {
      const promoBar = document.createElement("div");
      promoBar.id = "promo-bar";
      promoBar.innerHTML =
        'ÚLTIMAS HORAS: Essa oferta encerra em <span id="countdown">23:59:59</span>';

      document.body.insertBefore(
        promoBar,
        document.getElementById("root")
      );

      startPersistentCountdown();
    })();

    function startPersistentCountdown() {
      const countdownEl = document.getElementById("countdown");
      if (!countdownEl) return;

      const storageKey = "promo_end_time";
      const now = new Date().getTime();

      let endTime = localStorage.getItem(storageKey);

      if (!endTime || now > parseInt(endTime)) {
        endTime = now + 24 * 60 * 60 * 1000;
        localStorage.setItem(storageKey, endTime);
      }

      function updateCountdown() {
        const currentTime = new Date().getTime();
        const distance = endTime - currentTime;

        if (distance <= 0) {
          const newEndTime = currentTime + 24 * 60 * 60 * 1000;
          localStorage.setItem(storageKey, newEndTime);
          endTime = newEndTime;
          return;
        }

        const hours = Math.floor(
          (distance % (1000 * 60 * 60 * 24)) /
          (1000 * 60 * 60)
        );

        const minutes = Math.floor(
          (distance % (1000 * 60 * 60)) /
          (1000 * 60)
        );

        const seconds = Math.floor(
          (distance % (1000 * 60)) /
          1000
        );

        countdownEl.textContent =
          String(hours).padStart(2, "0") +
          ":" +
          String(minutes).padStart(2, "0") +
          ":" +
          String(seconds).padStart(2, "0");
      }

      updateCountdown();
      setInterval(updateCountdown, 1000);
    }
  </script>
</body>
</html>
