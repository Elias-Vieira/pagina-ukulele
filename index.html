<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="https://base44.com/logo_v2.svg" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="manifest" href="/manifest.json" />
    <title>Violão Para Iniciantes</title>

    <!-- Google Analytics 4 -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-TJQTWDNTWG"></script>

    <script>
      window.dataLayer = window.dataLayer || [];

      function gtag() {
        dataLayer.push(arguments);
      }

      gtag("js", new Date());
      gtag("config", "G-TJQTWDNTWG");

      // Captura e persiste UTMs da URL no localStorage
      (function () {
        var params = new URLSearchParams(window.location.search);

        ["utm_source", "utm_medium", "utm_campaign"].forEach(function (k) {
          var v = params.get(k);
          if (v) localStorage.setItem(k, v);
        });
      })();
    </script>

    <script>
      window.addEventListener("load", function () {
        document.addEventListener("click", function (e) {
          const el = e.target.closest("a, button");
          if (!el) return;

          const link = el.href || "";
          const texto = (el.innerText || "").toLowerCase();

          if (
            link.includes("pay.hotmart.com") ||
            texto.includes("liberar meu acesso")
          ) {
            gtag("event", "click_compra", {
              utm_source: localStorage.getItem("utm_source"),
              utm_medium: localStorage.getItem("utm_medium"),
              utm_campaign: localStorage.getItem("utm_campaign"),
              checkout_url: link,
              page_location: window.location.href,
              page_title: document.title,
            });

            e.preventDefault();

            setTimeout(function () {
              window.location.href = link;
            }, 300);
          }
        });
      });
    </script>
    <script type="module" crossorigin src="/assets/index-B1s2J2sq.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/index-BPbJ2cw2.css">
  </head>

  <body>
    <!-- Barra de promoção -->
    <div id="promo-bar">
      ÚLTIMAS HORAS: Essa oferta encerra em
      <span id="countdown">23:59:59</span>
    </div>

    <div id="root"></div>


    <script>
      // Função robusta para detectar navegador TikTok
      function isTikTokBrowser() {
        const ua = navigator.userAgent || "";
        return /(BytedanceWebview|musical_ly|TikTok|ByteDance|TikTokWebView)/i.test(ua);
      }

      // Esconde a barra se for navegador TikTok
      (function () {
        if (isTikTokBrowser()) {
          const promoBar = document.getElementById("promo-bar");
          if (promoBar) promoBar.style.display = "none";
        }
      })();

      function startPersistentCountdown() {
        const countdownEl = document.getElementById("countdown");
        if (!countdownEl) return;

        const storageKey = "promo_end_time";
        const now = new Date().getTime();
        let endTime = localStorage.getItem(storageKey);

        if (!endTime || now > parseInt(endTime)) {
          endTime = now + 24 * 60 * 60 * 1000; // 24 horas
          localStorage.setItem(storageKey, endTime);
        }

        function updateCountdown() {
          const currentTime = new Date().getTime();
          const distance = endTime - currentTime;

          if (distance <= 0) {
            const newEndTime = currentTime + 24 * 60 * 60 * 1000;
            localStorage.setItem(storageKey, newEndTime);
            endTime = newEndTime;
            return;
          }

          const hours = Math.floor((distance % (1000 * 60 * 60 * 24)) / (1000 * 60 * 60));
          const minutes = Math.floor((distance % (1000 * 60 * 60)) / (1000 * 60));
          const seconds = Math.floor((distance % (1000 * 60)) / 1000);

          const formattedTime =
            String(hours).padStart(2, "0") +
            ":" +
            String(minutes).padStart(2, "0") +
            ":" +
            String(seconds).padStart(2, "0");

          countdownEl.textContent = formattedTime;
        }

        updateCountdown();
        setInterval(updateCountdown, 1000);
      }

      startPersistentCountdown();
    </script>
  </body>
</html>
